name: Linux package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run dist:linux
        env:
          GIT_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: nodechem-studio-linux
          path: |
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
