name: Windows package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run dist
        env:
          GIT_COMMIT: ${{ github.sha }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/release-assets.mjs release
      - name: Generate SBOM
        shell: bash
        run: npm sbom --sbom-format cyclonedx --package-lock-only > sbom.cdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: nodechem-studio-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS
            sbom.cdx.json
          if-no-files-found: error
